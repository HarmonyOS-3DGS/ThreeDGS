upstream minio_cluster {
    # round_robin 均衡分发，避免上传/下载带宽集中于 M1
    # 将下方 M1_IP … MN_IP 替换为实际内网 IP
    server M1_IP:9000;
    server M2_IP:9000;
    server M3_IP:9000;
    # server M4_IP:9000;    ← 后续扩容时取消注释
    # server M5_IP:9000;
}

server {
    listen 80;
    client_max_body_size 10G;
    location /health {
        return 200 "OK";
    }
    location / {
        proxy_pass http://api:8000;
    }
}

# 前端页面独立端口，仅限内网访问
server {
    listen 8888;
    client_max_body_size 10G;
    # 仅允许内网和 M1 本机访问
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;

    root /usr/share/nginx/html/frontend;
    index index.html;

    # API 路径反向代理到 FastAPI
    location ~ ^/(tasks|auth|sse|docs|openapi\.json|redoc)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 300;
    }

    # 静态文件
    location / {
        sub_filter '<!--CONFIG_INJECT-->' '<script>window.APP_CONFIG={API_BASE:"${FRONTEND_API_BASE}/tasks",AUTH_URL:"${FRONTEND_API_BASE}/auth/token"}</script>';
        sub_filter_once on;
        sub_filter_types text/html;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 9003;
    client_max_body_size 10G;
    location /health {
        return 200 "OK";
    }
    location / {
        proxy_pass http://minio_cluster;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }
}
