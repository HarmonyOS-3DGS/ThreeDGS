openapi: "3.0.3"
info:
  title: 3DGS Platform API
  description: |
    3D Gaussian Splatting（3DGS）端到端训练平台 API v4。

    核心流程：
      1. 创建任务（POST /tasks）→ 返回上传 URL，状态 pending
      2. 客户端 PUT 文件到预签名 URL / 本地上传端点
      3. 启动任务（POST /tasks/{taskId}/start）→ 检查文件 → processing
      4. 轮询/SSE 等待（GET /tasks/{taskId} / GET /tasks/{taskId}/events）

    内部流水线阶段（外部只感知 pending / processing / completed / failed）：
      initializing → extracting → colmap → training → compressing → completed

    接口鉴权使用 JWT Bearer Token（OAuth2 Client Credentials 风格）：
      1. 调用 POST /auth/token（Basic Auth）换取 JWT
      2. 后续请求使用 Authorization: Bearer <JWT>
      3. 按 client_id 隔离任务数据，归属校验失败返回 404
  version: "4.0.0"

servers:
  - url: http://localhost:8000
    description: 本地开发服务器

paths:
  /auth/token:
    post:
      summary: 换取 JWT Token
      description: |
        使用 OAuth2 Client Credentials 流程，通过 Basic Auth 换取 JWT Bearer Token。
        后续请求使用 Authorization: Bearer <JWT>。
      tags:
        - auth
      operationId: getToken
      parameters:
        - name: Authorization
          in: header
          required: true
          description: "Basic base64(client_id:secret)"
          schema:
            type: string
            example: "Basic cGFydG5lci1hOnNrLXh4eA=="
      responses:
        "200":
          description: Token 颁发成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access_token
                    example: "eyJhbGciOiJIUzI1NiIs..."
                  token_type:
                    type: string
                    example: "bearer"
                  expires_in:
                    type: integer
                    example: 3600
        "401":
          description: 凭证无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRsp"

  /tasks:
    get:
      summary: 列出任务
      description: 列出指定项目的所有任务，按创建时间倒序
      tags:
        - taskManagement
      operationId: listTasks
      security:
        - bearer_auth: []
      parameters:
        - name: projectId
          in: header
          required: true
          description: 项目 ID
          schema:
            type: string
            maxLength: 20
            example: "proj-001"
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    post:
      summary: 创建3DGS任务
      description: |
        创建训练任务，不传实际文件，仅注册元数据并返回预签名上传 URL。
        客户端使用返回的 UrlInfo 自行 PUT 文件到 MinIO / 本地上传端点。
        状态为 pending，长时间不启动会被清理。
      tags:
        - taskManagement
      operationId: createTask
      security:
        - bearer_auth: []
      parameters:
        - name: projectId
          in: header
          required: true
          description: 项目 ID
          schema:
            type: string
            maxLength: 20
            example: "proj-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskReq"
      responses:
        "200":
          description: 任务创建成功，返回上传 URL 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTaskRsp"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /tasks/{taskId}/start:
    post:
      summary: 启动任务
      description: 启动任务（pending → processing），提交四阶段 Celery 流水线
      tags:
        - taskManagement
      operationId: startTask
      security:
        - bearer_auth: []
      parameters:
        - name: projectId
          in: header
          required: true
          schema:
            type: string
            maxLength: 20
        - name: taskId
          in: path
          required: true
          description: 任务 ID（Snowflake 纯数字递增）
          schema:
            type: string
            maxLength: 32
            example: "332011480592384"
      responses:
        "200":
          description: 启动成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartTaskRsp"
        "400":
          description: 任务状态不是 pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRsp"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: 任务不存在

  /tasks/{taskId}:
    get:
      summary: 查询任务
      description: 查询任务状态、进度、剩余时间和输出文件下载信息
      tags:
        - taskManagement
      operationId: getTask
      security:
        - bearer_auth: []
      parameters:
        - name: projectId
          in: header
          required: true
          schema:
            type: string
            maxLength: 20
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: 任务信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTaskRsp"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: 任务不存在

  /tasks/{taskId}/upload/{objectId}:
    put:
      summary: 上传文件（本地模式）
      description: 本地模式下将文件上传到服务端存储。Docker 模式通过 MinIO 预签名 URL 直接上传，不使用此端点。
      tags:
        - fileTransfer
      operationId: uploadFile
      security:
        - bearer_auth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
        - name: objectId
          in: path
          required: true
          schema:
            type: string
          description: 对象 ID，来自创建任务响应中 uploadInfos[].objectId
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 上传成功
        "400":
          description: 文件已存在或参数错误
        "404":
          description: objectId 无效

  /tasks/{taskId}/download/{objectId}:
    get:
      summary: 下载输出文件
      description: 下载任务的输出文件（raw_model PLY / SPZ / SOG）。Docker 模式 302 重定向到 MinIO 预签名 URL。
      鉴权同时支持 Header 和 Query 参数（`projectId` 和 `Authorization`）。
      tags:
        - fileTransfer
      operationId: downloadFile
      security:
        - bearer_auth: []
      parameters:
        - name: projectId
          in: header
          required: true
          schema:
            type: string
            maxLength: 20
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
        - name: objectId
          in: path
          required: true
          description: 对象 ID，来自查询任务响应中 downloadInfos[].objectId
          schema:
            type: string
          example: "tasks/332011480592384/compressed/model.spz"
        - name: projectId
          in: query
          required: false
          description: 项目 ID（未提供时从 Header 读取）
          schema:
            type: string
            maxLength: 20
        - name: Authorization
          in: query
          required: false
          description: 鉴权 Token（未提供时从 Header 读取，兼容 EventSource）
          schema:
            type: string
      responses:
        "200":
          description: 文件内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: 重定向到 MinIO 预签名下载 URL
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: 任务或文件不存在

  /tasks/{taskId}/events:
    get:
      summary: SSE 实时进度
      description: |
        Server-Sent Events 实时推送训练进度，每 2 秒推送。
        鉴权通过 Query 参数传递（EventSource 不支持自定义 Header）。

        事件类型：
        - status: 进度更新 {status, stage, progress, remainingTime, updatedAt}
        - done: 完成/失败 {finalStatus}
        - error: 任务不存在 {ret: {code, msg}}
      tags:
        - sse
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: Authorization
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: object
              example: |
                event: status
                data: {"status":"processing","stage":"training","progress":55,"remainingTime":8,"updatedAt":"2026-06-05T12:00:00"}

                event: done
                data: {"finalStatus":"completed"}

components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token（通过 POST /auth/token 获取）

  schemas:
    ConnectRet:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 返回码，0 表示成功
          example: 0
        msg:
          type: string
          description: 返回描述
          example: "success"

    UrlInfo:
      type: object
      required: [objectId, fileName, url, method]
      properties:
        objectId:
          type: string
          description: 对象 ID（文件名，不含路径前缀）
          example: "scene.mp4"
        fileName:
          type: string
          description: 文件名
          example: "scene.mp4"
        url:
          type: string
          description: 访问 URL（上传或下载的预签名地址）
          example: "http://minio:9000/gaussian/tasks/...?signature=..."
        method:
          type: string
          enum: [PUT, GET]
          description: HTTP 请求方法
          example: "PUT"
        headers:
          type: object
          description: 请求所需的额外 HTTP 头信息
          additionalProperties:
            type: string
          example:
            Content-Type: "video/mp4"

    FileInfo:
      type: object
      required: [fileName, fileUrl]
      properties:
        fileName:
          type: string
          maxLength: 256
          description: 文件名（含后缀）
          example: "scene.mp4"
        sha256:
          type: string
          maxLength: 64
          description: SHA256 哈希
        contentLength:
          type: integer
          format: int64
          description: 文件大小（字节）
        fileUrl:
          type: string
          description: 文件路径
        fileRole:
          type: string
          description: "文件角色：source_video / source_images / compressed_model / raw_model / pose_data"
          example: "source_video"
        mimeType:
          type: string
          description: MIME 类型
          example: "video/mp4"

    CreateTaskReq:
      type: object
      required: [externalCode, fileInfos, scene]
      properties:
        externalCode:
          type: string
          maxLength: 256
          description: 外部系统唯一 ID
        fileInfos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/FileInfo"
        scene:
          type: string
          enum: [commodity, indoor, outdoor]
          description: 场景类型

    CreateTaskRsp:
      type: object
      required: [ret, taskId, uploadInfos]
      properties:
        ret:
          $ref: "#/components/schemas/ConnectRet"
        taskId:
          type: string
          description: 任务 ID（Snowflake 纯数字递增）
          example: "332011480592384"
        uploadInfos:
          type: array
          description: 上传 URL 列表（客户端按此列表 PUT 文件）
          items:
            $ref: "#/components/schemas/UrlInfo"

    StartTaskRsp:
      type: object
      required: [ret, remainingTime]
      properties:
        ret:
          $ref: "#/components/schemas/ConnectRet"
        remainingTime:
          type: integer
          format: int64
          description: 预计剩余时间（秒）
          example: 15

    GetTaskRsp:
      type: object
      required: [ret, taskId, externalCode, status, currentStage, progress, remainingTime, scene, errorMessage, createdAt, updatedAt, downloadInfos]
      properties:
        ret:
          $ref: "#/components/schemas/ConnectRet"
        taskId:
          type: string
          example: "332011480592384"
        externalCode:
          type: string
          description: 外部系统唯一 ID
          example: "EXT-001"
        status:
          type: string
          enum: [pending, processing, completed, failed]
          example: "processing"
        currentStage:
          type: string
          description: 内部阶段
          enum: [initializing, extracting, colmap, training, compressing, completed, failed]
          example: "training"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 55
        remainingTime:
          type: integer
          format: int64
          example: 8
        scene:
          type: string
          example: "indoor"
        errorMessage:
          type: string
          description: 错误信息（失败时不为空）
          example: ""
        createdAt:
          type: string
          description: 创建时间（UTC，前端展示时转为北京时间）
          example: "2026-06-30 04:00:00"
        updatedAt:
          type: string
          description: 更新时间（UTC，前端展示时转为北京时间）
          example: "2026-06-30 04:05:00"
        downloadInfos:
          type: array
          description: 可下载文件列表（完成后非空），每项为预签名下载 URL
          items:
            $ref: "#/components/schemas/UrlInfo"

    TaskListResponse:
      type: object
      required: [ret, items, total]
      properties:
        ret:
          $ref: "#/components/schemas/ConnectRet"
        items:
          type: array
          items:
            $ref: "#/components/schemas/GetTaskRsp"
        total:
          type: integer
          example: 5

    ErrorRsp:
      type: object
      properties:
        ret:
          $ref: "#/components/schemas/ConnectRet"
      example:
        ret:
          code: 400
          msg: "Task status is processing, expected pending"

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorRsp"
    UnauthorizedError:
      description: 鉴权失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorRsp"
          example:
            ret:
              code: 401
              msg: "Invalid or missing Authorization"
