openapi: "3.0.3"
info:
  title: 3DGS Platform API
  description: |
    3D Gaussian Splatting（3DGS）端到端训练平台 API。

    核心流程：
      1. 创建任务（POST /tasks）—— 状态 pending
      2. 启动任务（POST /tasks/{task_id}/start）—— status: pending → processing
      3. 查询任务（GET /tasks/{task_id}）—— 获取状态、进度、下载信息

    内部流水线阶段（外部只感知 pending / processing / completed / failed）：
      initializing → extracting → colmap → training → compressing → completed

    支持 SSE 实时进度推送（GET /tasks/{task_id}/events）。
  version: "3.0.0"

servers:
  - url: http://localhost:8000
    description: 本地开发服务器

paths:
  /tasks:
    post:
      summary: 创建3DGS任务
      description: |
        创建训练任务，状态为 pending，长时间不启动任务会被清理。
      tags:
        - taskManagement
      operationId: createTask
      security:
        - app_auth: []
      parameters:
        - name: projectId
          in: header
          required: true
          description: 项目 ID
          schema:
            type: string
            maxLength: 20
            example: "proj-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskReq"
      responses:
        "200":
          description: 任务创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTaskRsp"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /tasks/{task_id}/start:
    post:
      summary: 启动任务
      description: |
        启动一个已创建的任务（status: pending → processing），提交四阶段 Celery 训练流水线。
      tags:
        - taskManagement
      operationId: startTask
      security:
        - project_auth: []
      parameters:
        - name: projectId
          in: header
          required: true
          description: 项目 ID
          schema:
            type: string
            maxLength: 20
            example: "proj-001"
        - name: task_id
          in: path
          required: true
          description: 任务 ID（纯数字）
          schema:
            type: string
            maxLength: 32
            example: "20260604001"
      responses:
        "200":
          description: 任务启动成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartTaskRsp"
        "400":
          description: 任务状态不是 pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                ret:
                  code: 400
                  msg: "Task status is processing, expected pending"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                ret:
                  code: 404
                  msg: "Task not found"

  /tasks/{task_id}:
    get:
      summary: 查询任务状态
      description: |
        查询3DGS任务执行情况。长时间不获取重建后的模型文件，会被清理。
      tags:
        - taskManagement
      operationId: getTask
      security:
        - project_auth: []
      parameters:
        - name: projectId
          in: header
          required: true
          description: 项目 ID
          schema:
            type: string
            maxLength: 20
            example: "proj-001"
        - name: task_id
          in: path
          required: true
          description: 任务 ID（纯数字）
          schema:
            type: string
            maxLength: 32
            example: "20260604001"
      responses:
        "200":
          description: 任务状态信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTaskRsp"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                ret:
                  code: 404
                  msg: "Task not found"

  /tasks/{task_id}/events:
    get:
      summary: SSE 实时进度推送
      description: |
        通过 Server-Sent Events（SSE）实时推送训练进度。
        每 2 秒推送一次当前状态，任务完成或失败后自动终止。

        事件类型：
        - `status`：进度更新事件
        - `done`：流水线结束事件（final_status 为 completed 或 failed）
        - `error`：任务不存在错误
      tags:
        - sse
      security:
        - project_auth: []
      parameters:
        - name: projectId
          in: header
          required: true
          description: 项目 ID
          schema:
            type: string
            maxLength: 20
            example: "proj-001"
        - name: task_id
          in: path
          required: true
          description: 任务 ID（纯数字）
          schema:
            type: string
            maxLength: 32
            example: "20260604001"
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: object
              example: |
                event: status
                data: {"status":"processing","stage":"training","progress":55,"remainingTime":8,"updatedAt":"2026-06-04T12:00:00"}

                event: done
                data: {"finalStatus":"completed"}
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: 任务不存在

components:
  securitySchemes:
    app_auth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        应用级鉴权（用于创建任务）。
        鉴权策略: serviceAccountCredentials
    project_auth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        项目级鉴权（用于启动、查询、SSE）。
        鉴权策略: serviceAccount，acceptValue: com.xxx.yyy.permission，credentialType: project

  schemas:
    FileInfo:
      type: object
      description: 文件元数据信息（请求和响应统一模型）
      required:
        - fileName
        - fileUrl
      properties:
        fileName:
          type: string
          maxLength: 256
          description: 原始文件名（含后缀）
          example: "scene.mp4"
        sha256:
          type: string
          maxLength: 64
          description: 文件内容的 SHA256 哈希值
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        contentLength:
          type: integer
          format: int64
          description: 文件大小（字节）
          example: 1048576
        fileUrl:
          type: string
          description: 本地文件路径（后续改为 OBS 桶对象 ID）
          example: "./local_storage/uploads/20260604001/scene.mp4"

    ConnectRet:
      type: object
      description: 通用返回码
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          description: 返回码（0 表示成功）
          example: 0
        msg:
          type: string
          description: 返回描述
          example: "success"

    CreateTaskReq:
      type: object
      description: 创建任务请求体
      required:
        - externalCode
        - fileInfos
        - scene
      properties:
        externalCode:
          type: string
          maxLength: 256
          description: 外部系统唯一 ID（只记录，不校验）
          example: "EXT-001-20260604"
        fileInfos:
          type: array
          minItems: 1
          maxItems: 3
          description: 上传文件信息列表
          items:
            $ref: "#/components/schemas/FileInfo"
        scene:
          type: string
          maxLength: 32
          description: 场景类型
          enum:
            - commodity
            - indoor
            - outdoor
          example: "indoor"

    CreateTaskRsp:
      type: object
      description: 创建任务响应
      required:
        - ret
        - taskId
        - fileInfos
      properties:
        ret:
          $ref: "#/components/schemas/ConnectRet"
        taskId:
          type: string
          description: 任务 ID（纯数字）
          example: "20260604001"
        fileInfos:
          type: array
          description: 任务关联文件的上传信息（与请求一一对应）
          items:
            $ref: "#/components/schemas/FileInfo"

    StartTaskRsp:
      type: object
      description: 启动任务响应
      required:
        - ret
        - remainingTime
      properties:
        ret:
          $ref: "#/components/schemas/ConnectRet"
        remainingTime:
          type: integer
          format: int64
          description: 预计剩余时间（秒，Stub 固定值 15）
          example: 15

    GetTaskRsp:
      type: object
      description: 查询任务响应
      required:
        - ret
        - status
        - currentStage
        - progress
        - remainingTime
        - downloadInfos
      properties:
        ret:
          $ref: "#/components/schemas/ConnectRet"
        status:
          type: string
          description: 任务状态
          enum:
            - pending
            - processing
            - completed
            - failed
          example: "processing"
        currentStage:
          type: string
          description: 内部流水线阶段（initializing / extracting / colmap / training / compressing / completed）
          example: "training"
        progress:
          type: integer
          description: 进度百分比（0-100）
          minimum: 0
          maximum: 100
          example: 55
        remainingTime:
          type: integer
          format: int64
          description: 预计剩余时间（秒，仅在 processing 状态时有意义）
          example: 8
        downloadInfos:
          type: array
          description: 可下载的输出文件列表（任务完成后非空）
          items:
            $ref: "#/components/schemas/FileInfo"

    ErrorDetail:
      type: object
      description: 错误响应
      properties:
        ret:
          $ref: "#/components/schemas/ConnectRet"

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            ret:
              code: 400
              msg: "请求参数不合法"
    UnauthorizedError:
      description: 鉴权失败（Authorization 缺失或无效）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            ret:
              code: 401
              msg: "Invalid or missing Authorization"

x-tagGroups:
  - name: 任务管理
    tags:
      - taskManagement
  - name: 实时推送
    tags:
      - sse
