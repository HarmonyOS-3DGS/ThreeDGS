<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DGS Platform - 任务列表</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>
    <nav class="topnav">
        <div class="logo">3DGS Platform</div>
        <div class="nav-links">
            <a href="/index.html">上传</a>
            <a href="/status.html" class="active">任务列表</a>
        </div>
        <div class="auth-area">
            <div class="auth-field">
                <label>账号</label>
                <input id="auth-client-id" placeholder="client_id">
            </div>
            <div class="auth-field">
                <label>密码</label>
                <input id="auth-client-secret" type="password" placeholder="secret">
            </div>
            <button onclick="login()">登录</button>
            <span id="auth-status" class="auth-status"></span>
        </div>
    </nav>

    <div class="content">
        <h2 class="page-title">任务列表</h2>
        <div class="card">
            <div class="filter-bar" style="margin-bottom:1rem;">
                <label for="project-id-input">项目 ID</label>
                <input type="text" id="project-id-input" placeholder="输入项目 ID" maxlength="20">
                <button onclick="switchProject()">查询</button>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>任务 ID</th>
                        <th>外部编码</th>
                        <th>场景</th>
                        <th>状态 / 阶段</th>
                        <th>进度</th>
                        <th>创建时间</th>
                        <th>更新时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="project-list">
                    <tr><td colspan="8" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
