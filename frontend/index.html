<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DGS Platform - 上传</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 3D Gaussian Splatting 平台</h1>
        <nav class="nav">
            <a href="/index.html">上传</a>
            <a href="/status.html">任务列表</a>
        </nav>

            <div class="card">
                <h2>创建训练任务</h2>
                <form id="upload-form">
                    <label for="external-code">外部系统唯一码</label>
                    <input type="text" id="external-code" name="external_code" placeholder="输入外部系统标识码" required>

                    <label for="file-input">选择文件（可多选）</label>
                    <input type="file" id="file-input" name="files" accept="video/*,image/*" multiple required>

                    <button type="submit" id="submit-btn">创建任务</button>
                </form>
                <div id="result" style="margin-top:1rem;"></div>
            </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
