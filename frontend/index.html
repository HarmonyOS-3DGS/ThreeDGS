<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DGS Platform - 上传</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 3D Gaussian Splatting 平台</h1>
        <nav class="nav">
            <a href="/index.html">上传</a>
            <a href="/status.html">任务列表</a>
        </nav>

        <div class="card">
            <h2>上传视频/图片</h2>
            <form id="upload-form">
                <label for="name">项目名称</label>
                <input type="text" id="name" name="name" placeholder="输入项目名称" required>

                <label for="file">选择文件</label>
                <input type="file" id="file" name="file" accept="video/*,image/*" required>

                <button type="submit" id="submit-btn">开始训练</button>
            </form>
            <div id="result" style="margin-top:1rem;"></div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
