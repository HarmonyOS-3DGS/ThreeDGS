version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/gaussian
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gaussian
      - MINIO_SECURE=false
      - MINIO_PUBLIC_ENDPOINT=你的服务器IP:9000
      - USE_LOCAL_STORAGE=false
      - LOCAL_STORAGE_DIR=/app/local_storage
      - API_KEY=${API_KEY:-}
      - ALG_ENABLED=false
      - ALG_EXPECTED_SECONDS=960
      - ALG_MAX_SECONDS=3600
      - OUTPUT_TYPES=${OUTPUT_TYPES:-["raw_model"]}
      - LOG_FILE=/app/logs/3dgs.log
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - /data/3dgs/tasks:/app/local_storage/tasks
      - /data/3dgs/logs:/app/logs

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/gaussian
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gaussian
      - MINIO_SECURE=false
      - MINIO_PUBLIC_ENDPOINT=你的服务器IP:9000
      - USE_LOCAL_STORAGE=false
      - LOCAL_STORAGE_DIR=/app/local_storage
      - API_KEY=${API_KEY:-}
      - ALG_ENABLED=false
      - ALG_IMAGE=alg_pipeline
      - ALG_SCRIPT=alg_pipeline.pyc
      - ALG_HOST_DATA_DIR=/data/3dgs
      - ALG_OUTPUT_DIR=output
      - ALG_PLY_NAME=point_cloud.ply
      - ALG_PLY_SUBDIR=gaussian_splatting/out/train/grid_0_0/point_cloud
      - ALG_EXPECTED_SECONDS=960
      - ALG_MAX_SECONDS=3600
      - OUTPUT_TYPES=${OUTPUT_TYPES:-["raw_model"]}
      - LOG_FILE=/app/logs/3dgs.log
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - /data/3dgs/tasks:/app/local_storage/tasks
      - /data/3dgs/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gaussian
    volumes:
      - /data/3dgs/pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaussian"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - /data/3dgs/miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
